# EduCenter Telegram CRM - production-oriented Docker Compose stack.
#
#   docker compose up -d --build
#
# Services:
#   db       PostgreSQL 16 (data in the `pgdata` volume; not exposed outside the stack)
#   migrate  one-shot: applies Alembic migrations, then exits
#   api      FastAPI admin API (internal only, reached through `web`)
#   worker   Telegram worker: the ONLY process that touches the Telegram session (`tgsession` volume)
#   web      nginx serving the dashboard and proxying /api (published on 127.0.0.1:${WEB_PORT})
#
# Put an HTTPS reverse proxy (Caddy, nginx, Traefik) in front of `web` in production.

name: educenter-crm

x-backend: &backend
  build: ./backend
  image: educenter-crm-backend:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-educenter}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-educenter}
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-educenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-educenter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-educenter}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-educenter}
      # nginx (`web`) is one proxy hop; add one per extra HTTPS proxy in front of it.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      # The API never talks to Telegram: keep Telegram/bot secrets out of its environment.
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""
      TELEGRAM_PHONE: ""
      ALERT_BOT_TOKEN: ""
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.main"]
    stop_grace_period: 30s
    volumes:
      - tgsession:/data/session
    healthcheck:
      # Healthy while the worker's database heartbeat is fresh (detects a hung or crashed worker).
      # The Telegram connection state itself is shown in the dashboard.
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    image: educenter-crm-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pgdata:
  tgsession:
